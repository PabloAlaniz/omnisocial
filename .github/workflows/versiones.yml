name: Versiones de API

# Avisa cuando la versión de API que usa un adaptador está por retirarse, o cuando hace mucho que nadie
# la compara con la documentación de la red. Abre un issue, o actualiza el que ya está abierto.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versiones:
    if: github.repository == 'PabloAlaniz/omnisocial'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with: { python-version: "3.13" }
      - run: uv sync --locked
      - name: Revisar
        id: revisar
        run: |
          if uv run python scripts/versiones.py --check > hallazgos.md; then
            echo "Todas las versiones están al día." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "hay=true" >> "$GITHUB_OUTPUT"
            cat hallazgos.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Avisar
        if: steps.revisar.outputs.hay == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: "Versiones de API para revisar"
        run: |
          {
            echo "La revisión semanal encontró versiones de API para mirar:"
            echo
            cat hallazgos.md
            echo
            echo "Después de comparar el adaptador con la documentación, actualizá \`api=ApiPin(...)\` en su \`spec.py\`."
          } > cuerpo.md
          abierto=$(gh issue list --state open --search "in:title \"$TITULO\"" --json number --jq '.[0].number // empty')
          if [ -n "$abierto" ]; then
            gh issue edit "$abierto" --body-file cuerpo.md
          else
            gh issue create --title "$TITULO" --body-file cuerpo.md
          fi
