site_name: omnisocial
site_description: Redes sociales con las mismas reglas, con un núcleo común y un adaptador por red.
site_url: https://pabloalaniz.github.io/omnisocial/
repo_url: https://github.com/PabloAlaniz/omnisocial
repo_name: PabloAlaniz/omnisocial
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Modo claro

markdown_extensions:
  - admonition
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Toda página de `docs/` tiene que estar acá: un test lo comprueba.
nav:
  - Inicio: index.md
  - Primeros pasos: primeros-pasos.md
  - Guías:
