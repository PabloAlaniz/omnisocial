[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "omnisocial"
version = "0.2.0"
description = "Redes sociales con las mismas reglas: login, conexiones, activos, publicaciones, comentarios, mensajes, métricas y webhooks, con un adaptador por red."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Pablo Alaniz" }]
keywords = ["social", "oauth", "graph-api", "facebook", "instagram", "tiktok", "youtube", "linkedin", "x", "twitter", "threads", "bluesky", "mastodon", "pixelfed", "fediverse", "pinterest", "reddit", "google-business-profile", "insights", "messaging", "comments", "webhooks"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = ["omniwebhook>=0.4,<0.5", "typing_extensions>=4.5"]

[project.optional-dependencies]
# El cliente HTTP de `omnisocial.httpx`.
httpx = ["httpx>=0.27"]
# El cifrado de tokens de `omnisocial.crypto`.
crypto = ["cryptography>=43"]
# Los repositorios de `omnisocial.postgres`.
postgres = ["psycopg[pool]>=3.2"]
# Las rutas de `omnisocial.starlette`, también para FastAPI.
starlette = ["starlette>=0.37"]

[project.urls]
Homepage = "https://github.com/PabloAlaniz/omnisocial"
Repository = "https://github.com/PabloAlaniz/omnisocial"
Issues = "https://github.com/PabloAlaniz/omnisocial/issues"
Changelog = "https://github.com/PabloAlaniz/omnisocial/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "cryptography>=43",
    "httpx>=0.28.1",
    "import-linter>=2.17",
    "mypy>=1.13",
    "psycopg[binary,pool]>=3.2",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    "ruff>=0.8",
    "starlette>=0.37",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omnisocial"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing:skip-covered -m 'not integration and not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "integration: necesita un servicio externo (PostgreSQL)",
    "live: llama a la API real de una red con credenciales de verdad",
]

[tool.coverage.run]
source_pkgs = ["omnisocial"]
branch = true
# Se prueban contra PostgreSQL de verdad, en los tests de integración.
omit = ["*/omnisocial/adapters/stores/postgres.py", "*/omnisocial/postgres.py"]

[tool.coverage.report]
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", "\\.\\.\\."]

[tool.mypy]
strict = true
enable_error_code = ["explicit-override", "ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
files = ["src", "tests", "scripts"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    # Base: errores, estilo, imports y modernización.
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "RET", "PERF", "FURB", "ISC", "FLY", "ICN",
    "PTH", "T20", "PGH", "ASYNC", "LOG", "G", "INP", "S", "PT", "N", "A",
    # Responsabilidad única: funciones chicas, pocas ramas, pocos argumentos.
    "C90", "PL",
    # Contratos claros: nada de argumentos sin usar, booleanos posicionales ni acceso a privados ajenos.
    "ARG", "FBT", "SLF",
    # Errores: nada de atrapar todo, mensajes y re-lanzamientos explícitos.
    "BLE", "TRY",
    # Tiempo: siempre con zona horaria.
    "DTZ",
    # Tipos: nada de `Any` en las firmas.
    "ANN401",
    # Imports: sin relativos, y efectos laterales sólo por sus puertos (ver banned-api).
    "TID",
    # Sin código comentado.
    "ERA",
]
ignore = [
    # El texto es español: las tildes y la ñ en docstrings, mensajes y nombres son a propósito.
    "RUF001", "RUF002", "RUF003", "PLC2401", "PLC2403",
    # Los mensajes de error explican el problema en el lugar donde se detecta.
    "TRY003",
    # Las excepciones del dominio se nombran por lo que pasó (`TokenRejected`), no con sufijo `Error`.
    "N818",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 4
max-branches = 8
max-returns = 5
max-statements = 30
max-bool-expr = 3

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["omnisocial.domain.window.TimeWindow"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Clean architecture a nivel de llamada: el tiempo, los ids, el azar y la configuración entran por puertos o
# por parámetros, nunca se toman del entorno. Sólo los adaptadores de sistema los tocan.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Usá el puerto Clock: el núcleo no lee el reloj."
"datetime.datetime.utcnow".msg = "Usá el puerto Clock: el núcleo no lee el reloj."
"datetime.datetime.today".msg = "Usá el puerto Clock: el núcleo no lee el reloj."
"datetime.date.today".msg = "Usá el puerto Clock: el núcleo no lee el reloj."
"time.time".msg = "Usá el puerto Clock: el núcleo no lee el reloj."
"uuid.uuid4".msg = "Usá el puerto IdGenerator."
"secrets".msg = "Usá el puerto SecretGenerator."
"random".msg = "Usá el puerto SecretGenerator: el azar no criptográfico no sirve para esto."
"os.urandom".msg = "Usá el puerto SecretGenerator (o el adaptador de cifrado)."
"os.environ".msg = "Una librería no lee variables de entorno: la configuración se inyecta."
"os.getenv".msg = "Una librería no lee variables de entorno: la configuración se inyecta."

[tool.ruff.lint.per-file-ignores]
# Los únicos lugares que tocan el reloj, el azar y los ids del sistema.
"src/omnisocial/adapters/system.py" = ["TID251"]
"src/omnisocial/adapters/crypto/aes_gcm.py" = ["TID251"]
# La raíz de composición recibe todas las dependencias a propósito.
"src/omnisocial/entrypoints/hub.py" = ["PLR0913"]
# El puerto HTTP tiene las dimensiones de un pedido HTTP: método, URL, query, cuerpo, cabeceras y si se repite.
"src/omnisocial/adapters/http/transport.py" = ["PLR0913"]
# El contrato de las redes son pruebas que viajan en el paquete: afirman con `assert`.
"src/omnisocial/testing/**" = ["S101"]
"src/omnisocial/testing/transport.py" = ["PLR0913"]
"tests/**" = [
    "S101", "S105", "S106", "S107",
    # Los dobles implementan puertos y no usan todos los argumentos.
    "ARG",
    # Valores esperados literales y tablas de casos.
    "PLR2004", "PLR0913", "PLR0917", "FBT",
    # Los tests miran adentro de los dobles.
    "SLF001",
]
"tests/integration/**" = ["S101", "TID251", "S608"]
# Herramientas del repositorio: se corren sueltas, no son un paquete.
"scripts/*.py" = ["INP001"]

# Reglas de arquitectura. Las dependencias apuntan hacia adentro:
#   entrypoints → adapters → application → domain
# Ver docs/adr/0001-arquitectura-en-capas.md.
[tool.importlinter]
root_package = "omnisocial"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Las capas dependen hacia adentro"
type = "layers"
layers = [
    "omnisocial.entrypoints",
    "omnisocial.adapters",
    "omnisocial.application",
    "omnisocial.domain",
]

[[tool.importlinter.contracts]]
name = "Las redes no se conocen entre sí ni las conoce el núcleo"
type = "independence"
modules = ["omnisocial.adapters.providers.*", "omnisocial.adapters.stores"]

[[tool.importlinter.contracts]]
name = "El kit de pruebas no lo usa el paquete"
type = "forbidden"
source_modules = [
    "omnisocial.domain",
    "omnisocial.application",
    "omnisocial.adapters",
    "omnisocial.entrypoints",
]
forbidden_modules = ["omnisocial.testing"]

[[tool.importlinter.contracts]]
name = "El núcleo no depende de paquetes opcionales"
type = "forbidden"
source_modules = ["omnisocial.domain", "omnisocial.application"]
forbidden_modules = ["httpx", "starlette", "psycopg", "cryptography"]
